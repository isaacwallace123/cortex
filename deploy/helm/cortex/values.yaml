# ── Global image settings ──────────────────────────────────────────────────────
# image.tag is updated automatically by the CI pipeline (git SHA) on every push.
image:
  registry: ghcr.io/isaacwallace123
  tag: af2a065a78d51dc5907c01c40022e1d3c5bc0e21
  pullPolicy: Always

# ── Node selector ─────────────────────────────────────────────────────────────
nodeSelector:
  node-role.kubernetes.io/ai: "true"

# ── Default resource requests/limits for all Go services ─────────────────────
defaultResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# ── Ingress ───────────────────────────────────────────────────────────────────
# Routes cortex.lan → api:8000 through the Envoy Gateway.
# After enabling, add a DNS override in AdGuard: cortex.lan → 192.168.0.245
ingress:
  enabled: true
  hostname: cortex.lan
  gatewayName: envoy-gateway
  gatewayNamespace: networking
  sectionName: https-lan

# ── Secrets (override via --set or a sealed-secrets / external-secrets flow) ──
secrets:
  sovereignAdminPassword: "changeme"
  cortexApiKey: ""
  beaconBraveApiKey: ""
  beaconSearxngUrl: ""

# ── Ollama (LLM backend) ──────────────────────────────────────────────────────
ollama:
  enabled: true
  model: llama3.2
  storage: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 8Gi

# ── Service definitions ───────────────────────────────────────────────────────
# Each entry is rendered into a Deployment + ClusterIP Service.
#
# Fields:
#   ports[]           list of {name, port} exposed by the container
#   metricsPort       port Prometheus should scrape (sets prometheus.io/port annotation)
#   storage           if set, creates a Longhorn PVC at /data of this size
#   workspaceStorage  if set, creates a Longhorn PVC at /workspace of this size
#   dockerSocket      if true, bind-mounts /var/run/docker.sock (crucible only)
#   serviceType       overrides ClusterIP (LoadBalancer for api + courier)
#   env               plain env vars injected into the container
#   secretEnv[]       list of {name, key} pulled from the cortex-secrets Secret

services:

  # ── Data layer (stateful, no upstream deps) ────────────────────────────────

  memory:
    ports:
      - name: grpc
        port: 7070
      - name: metrics
        port: 7071
    metricsPort: 7071
    storage: 2Gi
    env:
      MEMORY_ADDR: ":7070"
      MEMORY_DB_PATH: /data/memory.db

  nerva:
    ports:
      - name: grpc
        port: 3030
      - name: metrics
        port: 3031
    metricsPort: 3031
    storage: 2Gi
    env:
      NERVA_ADDR: ":3030"
      NERVA_DB_PATH: /data/nerva.db

  policy:
    ports:
      - name: grpc
        port: 6060
      - name: metrics
        port: 6061
    metricsPort: 6061
    storage: 1Gi
    env:
      POLICY_ADDR: ":6060"
      POLICY_DB: /data/policy.db

  vault:
    ports:
      - name: grpc
        port: 8181
      - name: metrics
        port: 8182
    metricsPort: 8182
    storage: 5Gi
    env:
      VAULT_ADDR: ":8181"
      VAULT_DB_PATH: /data/vault.db

  sovereign:
    ports:
      - name: grpc
        port: 4141
      - name: metrics
        port: 4142
    metricsPort: 4142
    storage: 1Gi
    env:
      SOVEREIGN_ADDR: ":4141"
      SOVEREIGN_DB: /data/sovereign.db
    secretEnv:
      - name: SOVEREIGN_ADMIN_PASSWORD
        key: sovereignAdminPassword

  arsenal:
    ports:
      - name: grpc
        port: 7373
      - name: metrics
        port: 7374
    metricsPort: 7374
    storage: 1Gi
    env:
      ARSENAL_PORT: "7373"
      ARSENAL_DB: /data/arsenal.db

  workspace:
    ports:
      - name: grpc
        port: 6262
      - name: metrics
        port: 6263
    metricsPort: 6263
    storage: 1Gi
    env:
      WORKSPACE_PORT: "6262"
      WORKSPACE_DB: /data/workspace.db

  compass:
    ports:
      - name: grpc
        port: 5151
      - name: metrics
        port: 5152
    metricsPort: 5152
    storage: 1Gi
    env:
      COMPASS_PORT: "5151"
      COMPASS_DB: /data/compass.db

  chat:
    ports:
      - name: grpc
        port: 9191
      - name: metrics
        port: 9192
    metricsPort: 9192
    storage: 2Gi
    env:
      CHAT_ADDR: ":9191"
      CHAT_DB_PATH: /data/chat.db

  catalyst:
    ports:
      - name: grpc
        port: 5353
      - name: metrics
        port: 5354
    metricsPort: 5354
    storage: 1Gi
    env:
      CATALYST_PORT: "5353"
      CATALYST_METRICS_PORT: "5354"
      CATALYST_DB: /data/catalyst.db
      BRAIN_ADDR: "brain:8090"

  genesis:
    ports:
      - name: grpc
        port: 4343
      - name: metrics
        port: 4344
    metricsPort: 4344
    storage: 1Gi
    env:
      GENESIS_PORT: "4343"
      GENESIS_METRICS_PORT: "4344"
      GENESIS_DB: /data/genesis.db
      INFERENCE_ADDR: "inference:9090"
      ARSENAL_ADDR: "arsenal:7373"

  # ── Compute layer (stateless) ──────────────────────────────────────────────

  inference:
    ports:
      - name: grpc
        port: 9090
      - name: metrics
        port: 9091
    metricsPort: 9091
    env:
      OLLAMA_URL: "http://ollama:11434"
      INFERENCE_DEFAULT_MODEL: "llama3.2"
      INFERENCE_ADDR: ":9090"

  shell:
    ports:
      - name: grpc
        port: 4040
      - name: metrics
        port: 4041
    metricsPort: 4041
    env:
      SHELL_ADDR: ":4040"

  forge:
    ports:
      - name: grpc
        port: 5050
      - name: metrics
        port: 5051
    metricsPort: 5051
    workspaceStorage: 10Gi
    env:
      FORGE_ADDR: ":5050"
      FORGE_ROOT: /workspace

  atlas:
    ports:
      - name: grpc
        port: 6161
      - name: metrics
        port: 6162
    metricsPort: 6162
    env:
      ATLAS_ADDR: ":6161"
      # Empty = use in-cluster service account (no kubeconfig file needed)
      ATLAS_KUBECONFIG: ""

  # Requires the host Docker socket to spawn sandbox containers.
  # The node running this pod must have Docker daemon available.
  crucible:
    ports:
      - name: grpc
        port: 7272
      - name: metrics
        port: 7273
    metricsPort: 7273
    dockerSocket: true
    env:
      CRUCIBLE_ADDR: ":7272"

  beacon:
    ports:
      - name: grpc
        port: 5252
      - name: metrics
        port: 5253
    metricsPort: 5253
    env:
      BEACON_ADDR: ":5252"
    secretEnv:
      - name: BEACON_BRAVE_API_KEY
        key: beaconBraveApiKey
      - name: BEACON_SEARXNG_URL
        key: beaconSearxngUrl

  # ── Courier — relay hub (external-facing LoadBalancer) ────────────────────

  courier:
    ports:
      - name: grpc
        port: 2020
      - name: metrics
        port: 2021
    metricsPort: 2021
    serviceType: LoadBalancer
    env:
      COURIER_ADDR: ":2020"
      NERVA_ADDR: "nerva:3030"

  # ── Brain — central orchestrator ──────────────────────────────────────────

  brain:
    ports:
      - name: http
        port: 8080
      - name: grpc
        port: 8090
    metricsPort: 8080
    env:
      INFERENCE_ADDR: "inference:9090"
      MEMORY_ADDR: "memory:7070"
      POLICY_ADDR: "policy:6060"
      SHELL_ADDR: "shell:4040"
      FORGE_ADDR: "forge:5050"
      NERVA_ADDR: "nerva:3030"
      COURIER_ADDR: "courier:2020"
      ATLAS_ADDR: "atlas:6161"
      CRUCIBLE_ADDR: "crucible:7272"
      VAULT_ADDR: "vault:8181"
      ARSENAL_ADDR: "arsenal:7373"
      COMPASS_ADDR: "compass:5151"
      WORKSPACE_ADDR: "workspace:6262"
      BEACON_ADDR: "beacon:5252"
      BRAIN_HTTP_ADDR: ":8080"
      BRAIN_GRPC_ADDR: ":8090"

  # ── Overwatch — anomaly analysis (queries cluster Prometheus) ─────────────
  # Points at the existing cluster Prometheus, not a cortex-local one.
  # This means overwatch sees metrics from ALL namespaces, not just cortex.

  overwatch:
    ports:
      - name: http
        port: 8484
    metricsPort: 8484
    env:
      PROMETHEUS_URL: "http://prometheus.monitoring.svc.cluster.local:9090"
      NERVA_ADDR: "nerva:3030"
      OVERWATCH_INTERVAL: "60"
      OVERWATCH_METRICS_ADDR: ":8484"

  # ── API gateway — REST frontend (external-facing LoadBalancer) ────────────

  api:
    ports:
      - name: http
        port: 8000
    metricsPort: 8000
    serviceType: LoadBalancer
    env:
      BRAIN_GRPC_ADDR: "brain:8090"
      MEMORY_GRPC_ADDR: "memory:7070"
      CHAT_GRPC_ADDR: "chat:9191"
      COMPASS_GRPC_ADDR: "compass:5151"
      POLICY_GRPC_ADDR: "policy:6060"
      SOVEREIGN_GRPC_ADDR: "sovereign:4141"
      WORKSPACE_GRPC_ADDR: "workspace:6262"
      API_ADDR: ":8000"
    secretEnv:
      - name: API_KEY
        key: cortexApiKey
