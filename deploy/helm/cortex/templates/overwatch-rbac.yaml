---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: overwatch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cortex.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cortex-overwatch
  labels:
    {{- include "cortex.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cortex-overwatch
  labels:
    {{- include "cortex.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cortex-overwatch
subjects:
  - kind: ServiceAccount
    name: overwatch
    namespace: {{ .Release.Namespace }}
