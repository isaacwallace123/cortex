{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
    {{- include "cortex.labels" $ | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        {{- if $svc.metricsPort }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $svc.metricsPort }}"
        prometheus.io/path: "/metrics"
        {{- end }}
    spec:
      {{- if $svc.nodeSelector }}
      nodeSelector:
        {{- toYaml $svc.nodeSelector | nindent 8 }}
      {{- else if $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if or $svc.storage $svc.workspaceStorage }}
      securityContext:
        fsGroup: 65532
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/cortex-{{ $name }}:{{ $svc.imageTag | default $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            {{- range $svc.ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
            {{- end }}
          env:
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range $svc.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: {{ .key }}
            {{- end }}
          {{- if or $svc.storage $svc.workspaceStorage $svc.dockerSocket }}
          volumeMounts:
            {{- if $svc.storage }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if $svc.workspaceStorage }}
            - name: workspace
              mountPath: /workspace
            {{- end }}
            {{- if $svc.dockerSocket }}
            - name: containerd-sock
              mountPath: /run/k3s/containerd/containerd.sock
            {{- end }}
          {{- end }}
          resources:
            {{- if $svc.resources }}
            {{- toYaml $svc.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.defaultResources | nindent 12 }}
            {{- end }}
          {{- if $svc.metricsPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.metricsPort }}
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.metricsPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          {{- if $svc.startupProbe }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.metricsPort }}
            initialDelaySeconds: {{ $svc.startupProbe.initialDelaySeconds | default 60 }}
            periodSeconds: 10
            failureThreshold: 12
          {{- end }}
          {{- end }}
      {{- if or $svc.storage $svc.workspaceStorage $svc.dockerSocket }}
      volumes:
        {{- if $svc.storage }}
        - name: data
          persistentVolumeClaim:
            claimName: cortex-{{ $name }}-data
        {{- end }}
        {{- if $svc.workspaceStorage }}
        - name: workspace
          persistentVolumeClaim:
            claimName: cortex-{{ $name }}-workspace
        {{- end }}
        {{- if $svc.dockerSocket }}
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
        {{- end }}
      {{- end }}
{{- end }}
