{{- range $name, $svc := .Values.services }}
{{- if $svc.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cortex-{{ $name }}-data
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Retain on helm uninstall so data survives accidental deletions.
    helm.sh/resource-policy: keep
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $svc.storage }}
{{- end }}
{{- if $svc.workspaceStorage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cortex-{{ $name }}-workspace
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $svc.workspaceStorage }}
{{- end }}
{{- end }}
