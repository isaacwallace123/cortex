use_default_settings: true

server:
  secret_key: "changeme-searxng-secret-key"
  limiter: false
  image_proxy: false
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

engines:
  - name: duckduckgo
    engine: duckduckgo
    categories: general
    shortcut: ddg
    disabled: false

  - name: duckduckgo images
    engine: duckduckgo_images
    categories: images
    shortcut: ddi
    disabled: false

  - name: wikipedia
    engine: wikipedia
    categories: general
    shortcut: wp
    disabled: false

  - name: karmasearch
    engine: karmasearch
    disabled: true

  - name: karmasearch videos
    engine: karmasearch
    disabled: true
