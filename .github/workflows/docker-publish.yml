name: Build & Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'pkg/**'
      - '*.work'
      - '*.work.sum'
      - '.github/workflows/docker-publish.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'pkg/**'
              - '*.work'
            arsenal:
              - 'services/arsenal/**'
              - 'pkg/**'
              - '*.work'
            atlas:
              - 'services/atlas/**'
              - 'pkg/**'
              - '*.work'
            beacon:
              - 'services/beacon/**'
              - 'pkg/**'
              - '*.work'
            brain:
              - 'services/brain/**'
              - 'pkg/**'
              - '*.work'
            catalyst:
              - 'services/catalyst/**'
              - 'pkg/**'
              - '*.work'
            chat:
              - 'services/chat/**'
              - 'pkg/**'
              - '*.work'
            compass:
              - 'services/compass/**'
              - 'pkg/**'
              - '*.work'
            courier:
              - 'services/courier/**'
              - 'pkg/**'
              - '*.work'
            crucible:
              - 'services/crucible/**'
              - 'pkg/**'
              - '*.work'
            forge:
              - 'services/forge/**'
              - 'pkg/**'
              - '*.work'
            genesis:
              - 'services/genesis/**'
              - 'pkg/**'
              - '*.work'
            inference:
              - 'services/inference/**'
              - 'pkg/**'
              - '*.work'
            memory:
              - 'services/memory/**'
              - 'pkg/**'
              - '*.work'
            nerva:
              - 'services/nerva/**'
              - 'pkg/**'
              - '*.work'
            overwatch:
              - 'services/overwatch/**'
              - 'pkg/**'
              - '*.work'
            policy:
              - 'services/policy/**'
              - 'pkg/**'
              - '*.work'
            shell:
              - 'services/shell/**'
              - 'pkg/**'
              - '*.work'
            sovereign:
              - 'services/sovereign/**'
              - 'pkg/**'
              - '*.work'
            vault:
              - 'services/vault/**'
              - 'pkg/**'
              - '*.work'
            workspace:
              - 'services/workspace/**'
              - 'pkg/**'
              - '*.work'

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ghcr.io/isaacwallace123/cortex-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/isaacwallace123/cortex-${{ matrix.service }}:latest
            ghcr.io/isaacwallace123/cortex-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-chart:
    name: Update Helm chart image tag
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Commit updated values.yaml
        run: |
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" deploy/helm/cortex/values.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/cortex/values.yaml
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: bump image tag to ${{ github.sha }}"
          git pull --rebase origin main
          git push
