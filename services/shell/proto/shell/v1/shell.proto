syntax = "proto3";

package shell.v1;

option go_package = "github.com/isaacwallace123/cortex/services/shell/gen/shell/v1;shellv1";

// ShellService is the Shell executor — it runs approved shell commands on behalf of Vector.
service ShellService {
  rpc ExecuteStep(ExecuteStepRequest) returns (ExecuteStepResponse);
}

message ExecuteStepRequest {
  string session_id  = 1;
  string plan_id     = 2;
  int32  step_index  = 3;
  string command     = 4;
}

message ExecuteStepResponse {
  string stdout      = 1;
  string stderr      = 2;
  int32  exit_code   = 3;
  int64  duration_ms = 4;
}
