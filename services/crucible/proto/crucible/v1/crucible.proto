syntax = "proto3";

package crucible.v1;

option go_package = "github.com/isaacwallace123/cortex/services/crucible/gen/crucible/v1;cruciblev1";

// CrucibleService manages isolated Docker sandboxes for safe code execution.
// Sandboxes have no network access, enforced CPU/memory limits, and are
// automatically destroyed after their timeout expires.
service CrucibleService {
  // RunCode creates an ephemeral sandbox, executes a command, destroys it,
  // and returns the output. This is the primary single-shot code execution path.
  rpc RunCode(RunCodeRequest) returns (RunCodeResponse);

  // CreateSandbox creates a persistent sandbox for multi-step workflows.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);

  // Exec runs a command inside an existing sandbox.
  rpc Exec(ExecRequest) returns (ExecResponse);

  // WriteFile writes content to a path inside the sandbox.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);

  // ReadFile reads a file from inside the sandbox.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

  // DestroySandbox immediately destroys a sandbox and frees resources.
  rpc DestroySandbox(DestroySandboxRequest) returns (DestroySandboxResponse);

  // ListSandboxes returns all currently active sandboxes.
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
}

// --- Message RunCodeRequest ---

message RunCodeRequest {
  string runtime     = 1; // "python3", "node", "go", "rust", "bash"
  string command     = 2; // shell command to run inside sandbox
  string stdin_input = 3; // optional stdin to pass to the command
  int32  timeout_secs = 4; // max wall-clock seconds, default 30
}

message RunCodeResponse {
  string stdout      = 1;
  string stderr      = 2;
  int32  exit_code   = 3;
  int64  duration_ms = 4;
  string runtime     = 5; // echo back for clarity
}

// --- Message CreateSandboxRequest ---

message CreateSandboxRequest {
  string runtime      = 1; // "python3", "node", "go", "rust", "bash"
  int32  timeout_secs = 2; // sandbox lifetime, default 600 (10 min)
}

message CreateSandboxResponse {
  string sandbox_id  = 1;
  string runtime     = 2;
  int64  created_at  = 3; // unix millis
  int32  timeout_secs = 4;
}

// --- Message ExecRequest ---

message ExecRequest {
  string sandbox_id   = 1;
  string command      = 2;
  string stdin_input  = 3;
  int32  timeout_secs = 4; // per-exec timeout, default 30
}

message ExecResponse {
  string stdout      = 1;
  string stderr      = 2;
  int32  exit_code   = 3;
  int64  duration_ms = 4;
}

// --- Message WriteFileRequest ---

message WriteFileRequest {
  string sandbox_id = 1;
  string path       = 2; // absolute path inside the container
  string content    = 3;
}

message WriteFileResponse {
  bool success = 1;
}

// --- Message ReadFileRequest ---

message ReadFileRequest {
  string sandbox_id = 1;
  string path       = 2; // absolute path inside the container
}

message ReadFileResponse {
  string content = 1;
}

// --- Message DestroySandboxRequest ---

message DestroySandboxRequest {
  string sandbox_id = 1;
}

message DestroySandboxResponse {
  bool destroyed = 1;
}

// --- Message ListSandboxesRequest ---

message ListSandboxesRequest {}

message ListSandboxesResponse {
  repeated SandboxInfo sandboxes = 1;
}

message SandboxInfo {
  string sandbox_id   = 1;
  string runtime      = 2;
  int64  created_at   = 3;
  int32  timeout_secs = 4;
}

