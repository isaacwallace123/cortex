syntax = "proto3";

package forge.v1;

option go_package = "github.com/isaacwallace123/cortex/services/forge/gen/forge/v1;forgev1";

// ForgeService is the filesystem executor — it performs sandboxed file operations on behalf of Vector.
service ForgeService {
  rpc ExecuteStep(ForgeStepRequest) returns (ForgeStepResponse);
}

message ForgeStepRequest {
  string session_id  = 1;
  string plan_id     = 2;
  int32  step_index  = 3;
  string command     = 4; // e.g. "ls /workspace", "cat /workspace/file.txt", "mkdir /workspace/dir"
}

message ForgeStepResponse {
  string output      = 1; // file contents, directory listing, etc.
  bool   ok          = 2; // false if the operation failed
  int64  duration_ms = 3;
}
