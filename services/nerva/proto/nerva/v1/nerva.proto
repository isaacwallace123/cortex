syntax = "proto3";

package nerva.v1;

option go_package = "github.com/isaacwallace123/cortex/services/nerva/gen/nerva/v1;nervav1";

// NervaService is the Cortex event bus.
// Subsystems publish events here; consumers subscribe to a live stream.
service NervaService {
  // Publish stores and fans out a single event to all active subscribers.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Subscribe opens a server-side stream. The caller receives every event
  // that matches the filter for as long as the stream is open.
  rpc Subscribe(SubscribeRequest) returns (stream EventMessage);
}

message PublishRequest {
  string subsystem  = 1; // e.g. "Prism", "Axiom", "Vector"
  string event_name = 2; // dot-separated: "prism.input.parsed"
  string session_id = 3; // optional — attached to session-scoped events
  string payload    = 4; // JSON string
}

message PublishResponse {
  string event_id  = 1;
  int64  timestamp = 2;
}

message SubscribeRequest {
  // filter controls which events are delivered.
  // ""           → all events
  // "Prism"      → subsystem match (case-insensitive)
  // "prism.input.parsed" → exact event_name match
  string filter = 1;
}

message EventMessage {
  string event_id   = 1;
  string subsystem  = 2;
  string event_name = 3;
  string session_id = 4;
  string payload    = 5;
  int64  timestamp  = 6;
}
